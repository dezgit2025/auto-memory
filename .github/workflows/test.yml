name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secrets / gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned release binary, verified against a checksum kept in this file:
      # no third-party action and no token involved.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # Pull requests scan only their own commits; pushes scan full history.
      # --redact keeps any finding out of the public log.
      - name: Scan commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$BASE_SHA..HEAD" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
          fi

  portable-test:
    name: Portable / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        run: >-
          pytest src/ -q -W error
          --ignore=src/session_recall/codex_fix/tests/test_v5_sandbox.py
          --ignore=src/session_recall/codex_fix/tests/test_v5_workflow.py

  windows-test:
    name: Windows / Python 3.12
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/

      # The Codex launcher and fixer are POSIX-only (deploy/install-codex.md);
      # native Windows covers recall for Copilot CLI and Claude Code.
      - name: Run tests
        shell: bash
        run: >-
          pytest src/ -q -W error
          --ignore=src/session_recall/codex_fix
          --ignore=src/session_recall/providers/codex

  package-smoke:
    name: Package / wheel install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP/pkg/bin/pip" install dist/*.whl

      - name: Check console scripts and bundled data
        env:
          SESSION_RECALL_ENABLE_CLAUDE_BACKEND: "1"
        run: |
          set -euo pipefail
          expected="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          src_pyz="$(ls src/session_recall/codex_fix/data/artifacts/*.pyz | wc -l)"
          bin="$RUNNER_TEMP/pkg/bin"
          cd "$RUNNER_TEMP"
          for cmd in session-recall session-recall-cc session-recall-claude \
                     session-recall-codex session-recall-codex-fix; do
            "$bin/$cmd" --help > /dev/null
          done
          test "$("$bin/session-recall" --version)" = "auto-memory $expected"
          test "$("$bin/session-recall-codex" --version)" = "$expected"
          test "$("$bin/session-recall-codex-fix" --version)" = "$expected"
          "$bin/python" - "$src_pyz" <<'EOF'
          import sys
          from importlib.resources import files
          fix = files("session_recall.codex_fix") / "data"
          codex = files("session_recall.providers.codex") / "verifications"
          for f in (fix / "catalogue-v1.json", fix / "model-policy-v3.json",
                    codex / "captured-profiles.json"):
              assert f.is_file(), f"missing from wheel: {f}"
          pyz = [p for p in (fix / "artifacts").iterdir() if p.name.endswith(".pyz")]
          assert len(pyz) == int(sys.argv[1]), f"wheel has {len(pyz)} .pyz, source has {sys.argv[1]}"
          print(f"package data ok ({len(pyz)} artifacts)")
          EOF

  v5-stage-c-macos:
    name: V5 Stage C / macOS ARM64
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select supported Homebrew Python
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install python@3.14
          python_prefix="$(brew --prefix python@3.14)"
          test "${python_prefix#/opt/homebrew/}" != "$python_prefix"
          "$python_prefix/bin/python3.14" --version
          "$python_prefix/bin/python3.14" -m venv "$RUNNER_TEMP/auto-memory-ci-venv"
          echo "$RUNNER_TEMP/auto-memory-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install package
        run: python3.14 -m pip install -e ".[dev]" "setuptools>=68" wheel

      - name: Lint with ruff
        run: python3.14 -m ruff check src/ verify/codex_assist_verify.py

      - name: Run full source tests with real SBPL
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.14 -m pytest src/ verify/test_codex_release_upgrade.py -q -W error

      - name: Verify Stage C mutation detector
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.14 verify/codex_assist_verify.py --self-test

      - name: Verify Stage C clean-install lifecycle
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.14 verify/codex_assist_verify.py --level L2
